services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # Item 24: Alembic migrations as a separate one-shot service so startup
  # failures in migration do not crash the api container restart loop.
  migration:
    build: .
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_HOSTNAME: db
    command: alembic upgrade head

  api:
    build: .
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_HOSTNAME: db
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    # Item 23: no host port exposed; traffic reaches the API only through the
    # Nginx frontend container which proxies /api/ → http://api:8000/
    volumes:
      - audio_uploads:/app/audio_uploads
      - whisper_models:/app/app/whisper_models
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/" ]
      interval: 10s
      timeout: 5s
      retries: 3
    # Item 18: gunicorn with uvicorn workers (4 processes) for production stability
    # Item 25: graceful shutdown via gunicorn default SIGTERM handling (30s timeout)
    command: >
      gunicorn app.main:app --worker-class uvicorn.workers.UvicornWorker --workers 4 --bind 0.0.0.0:8000 --timeout 120 --graceful-timeout 30 --access-logfile - --error-logfile -
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
        - action: rebuild
          path: ./requirements.txt

  celery_worker:
    build: .
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      DATABASE_HOSTNAME: db
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - audio_uploads:/app/audio_uploads
      - whisper_models:/app/app/whisper_models
    # Item 16: prefork pool so Whisper tasks don't block the GIL.
    # Concurrency capped at 1 (was 4): each forked worker process loads its
    # OWN copy of the Whisper "turbo" model into memory on first task
    # (get_whisper_model() caches per-process, not globally). Two handovers
    # arriving close together triggered two simultaneous full model loads,
    # which exhausted host memory and got a worker SIGKILL'd by the OOM
    # killer, freezing the whole app for ~2.5 minutes. Concurrency=1 means
    # handovers process one at a time (slower under load, but no crash).
    # If you want true parallel transcription, raise Docker Desktop's memory
    # allocation first, then raise this back up.
    command: >
      celery -A app.cores.celery_app.celery_app worker --loglevel=info --pool=prefork --concurrency=1
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/app
        - action: rebuild
          path: ./requirements.txt

  frontend:
    build: ./frontend
    restart: always
    depends_on:
      - api
    ports:
      - "5173:80"
    develop:
      watch:
        - action: sync
          path: ./frontend
          target: /usr/share/nginx/html
          ignore:
            - node_modules/
        - action: rebuild
          path: ./frontend/package.json

volumes:
  postgres_data:
  redis_data:
  audio_uploads:
  whisper_models:
