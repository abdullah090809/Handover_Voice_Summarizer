name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    environment: CI

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ${{ secrets.DATABASE_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          POSTGRES_DB: ${{ secrets.TEST_DATABASE_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      database_hostname: localhost
      database_port: 5432
      database_username: ${{ secrets.DATABASE_USERNAME }}
      database_password: ${{ secrets.DATABASE_PASSWORD }}
      database_name: ${{ secrets.TEST_DATABASE_NAME }}
      test_database_name: ${{ secrets.TEST_DATABASE_NAME }}

      redis_host: localhost
      redis_port: 6379

      secret_key: ${{ secrets.SECRET_KEY }}
      algorithm: ${{ secrets.ALGORITHM }}
      access_token_expire_minutes: ${{ secrets.ACCESS_TOKEN_EXPIRE_MINUTES }}

      gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
      gmail_smtp_user: ${{ secrets.GMAIL_SMTP_USER }}
      gmail_smtp_password: ${{ secrets.GMAIL_SMTP_PASSWORD }}

      seed_manager_email: ${{ secrets.SEED_MANAGER_EMAIL }}
      seed_manager_password: ${{ secrets.SEED_MANAGER_PASSWORD }}
      turnstile_secret_key: ${{ secrets.TURNSTILE_SECRET_KEY }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          # Item 34: install coverage + asyncio support
          pip install pytest-cov pytest-asyncio

      # Item 36: Dependency vulnerability scan
      - name: Security scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt --ignore-vuln GHSA-jfh8-c2jp-5h7v --skip-editable || true
          # '|| true' prevents CI from failing on known-acceptable vulns while we
          # track them in requirements.in comments; remove once all are resolved.

      - name: Run Alembic migrations
        run: alembic upgrade head

      # Item 34: Run tests with coverage
      - name: Run tests with coverage
        run: |
          pytest -v --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=60

      # Item 34: Upload coverage artifact for review
      - name: Upload coverage report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

      # Item 36: SAST via bandit (static security analysis)
      - name: SAST scan (bandit)
        run: |
          pip install bandit
          bandit -r app/ -ll --exclude app/cores/seed.py || true
          # '-ll' = medium severity and above; '|| true' = non-blocking for now.
          # Change to strict once all findings are triaged.